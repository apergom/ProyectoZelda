<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda Encyclopedia Web</title>
    <link rel="stylesheet" href="css/styles.css">

    <script type="module" src="js/ui.js" defer></script>
</head>
<body>
<header class="header">
    <h1 class="header__title">Zelda Encyclopedia</h1>
    <nav class="navigator-header">
        <ul class="navigator-header__ul">
            <li class="navigator-header__item"><a class="navigator-header__link" href="#buscador">Buscador</a></li>
            <li class="navigator-header__item"><a class="navigator-header__link" href="#favoritos">Favoritos</a></li>
        </ul>
    </nav>
</header>

<main class="main">

    <section id="buscador" class="section">
        <h2 class="main__heading">Buscador de la Saga</h2>
        <form class="search-form" onsubmit="event.preventDefault()">
            <fieldset class="search-form__fieldset">
                <legend>Busca en Hyrule</legend>
                <label>Categoría:</label>
                <select id="tipo-busqueda" class="search-form__input">
                    <option value="characters">Personajes</option>
                    <option value="games">Juegos</option>
                </select>

                <label>Término de búsqueda:</label>
                <input type="text" id="input-buscador" class="search-form__input" placeholder="Ej. Link, Zelda...">

                <article id="mensaje-buscador" class="form-message" style="min-height: 20px; font-weight: bold; margin-top: 10px;"></article>
            </fieldset>
        </form>
        <article id="resultados-busqueda" class="section-cards"></article>
    </section>

    <section id="favoritos" class="section">
        <h2 class="main__heading">Mis Favoritos</h2>


        <article class="filter-bar">
            <select id="ordenar-favoritos" class="search-form__input">
                <option value="recientes">Más recientes</option>
                <option value="az">Nombre A-Z</option>
            </select>

            <select id="filtrar-favoritos" class="search-form__input">
                <option value="todos">Todos los tipos</option>
                <option value="characters">Personajes</option>
                <option value="games">Juegos</option>
            </select>

            <button id="btn-vaciar-favoritos" class="btn btn--danger">Vaciar Favoritos</button>
        </article>

        <article id="resultados-favoritos" class="section-cards"></article>
    </section>
    <section id="catalogo" class="section">
        <h2 class="main__heading">Catálogo de Juegos (XML)</h2>
        <article class="filter-bar">
            <button type="button" id="btn-cargar-xml" class="btn">Cargar XML</button>
            <button type="button" id="btn-exportar-csv" class="btn" disabled>Exportar CSV</button>
        </article>
        <article id="resultados-xml" class="section-cards"></article>
    </section>


</main>

<footer class="footer">
    <p class="footer__text">Zelda Encyclopedia</p>
</footer>
</body>
</html>
